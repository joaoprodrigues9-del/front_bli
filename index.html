<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>biblioteca Central - Cadastrar Livro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <h1>Cadastrar Livro</h1>

        <form class="cadastro">
            <img src="img/logo.png" alt="Logo biblioteca" width="300px">
            <label for="text">Titulo</label>
            <input type="text">

            <label for="name">Nome do Autor</label>
            <input type="text">

            <label for="text">Ano de Publicacao</label>
            <input type="text">

            <button>Salvar</button>
        </form>

    </main>
</body>

</html>
